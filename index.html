<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBSE Result Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      color: #003366;
    }
    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0055aa;
    }
    footer {
      text-align: center;
      padding: 15px;
      background-color: #003366;
      color: white;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>CBSE Result Portal</h1>
    <p>Class 10 & Class 12 Results</p>
  </header>

  <div class="container">
    <h2>Check Your Result</h2>
    <form>
      <label for="class">Select Class:</label>
      <select id="class" name="class">
        <option value="10">Class 10</option>
        <option value="12">Class 12</option>
      </select>

      <label for="roll">Enter Roll Number:</label>
      <input type="text" id="roll" name="roll" placeholder="e.g. 1234567" required>

      <label for="dob">Enter Date of Birth:</label>
      <input type="date" id="dob" name="dob" required>

      <button type="submit">Check Result</button>
    </form>
  </div>

  <footer>
    <p>© 2026 CBSE Result Portal</p>
  </footer>
</body>
</html>
